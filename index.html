<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UZH Studio | Koshka Corp.</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --acc: #58a6ff;
            --green: #238636;
            --txt: #c9d1d9;
            --white: #ffffff;
            --kw: #ff7b72;
            --str: #a5d6ff;
            --var: #ffa657;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: 'Inter', sans-serif; }

        #snow-canvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999; }

        .fade-content { transition: opacity 0.3s ease, transform 0.3s ease; }
        .fade-hidden { opacity: 0; transform: translateY(10px); }

        .top-controls { position: absolute; top: 20px; right: 20px; z-index: 1000; display: flex; gap: 15px; align-items: center; }

        .snow-btn {
            background: rgba(22, 27, 34, 0.8); border: 1px solid #30363d; color: var(--white);
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex;
            align-items: center; justify-content: center; transition: 0.3s; backdrop-filter: blur(12px);
        }
        .snow-btn:hover { border-color: var(--acc); color: var(--acc); transform: scale(1.1); }
        .snow-btn.active { color: #7ee7ff; text-shadow: 0 0 10px #7ee7ff; border-color: #7ee7ff; }

        .lang-control {
            display: flex; align-items: center; gap: 10px;
            background: rgba(22, 27, 34, 0.8); padding: 8px 16px;
            border-radius: 50px; border: 1px solid #30363d; backdrop-filter: blur(12px);
        }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #30363d; border-radius: 34px; transition: 0.4s; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background: var(--white); border-radius: 50%; transition: 0.4s; }
        input:checked + .slider { background: var(--acc); }
        input:checked + .slider:before { transform: translateX(20px); }
        .lang-label { font-size: 12px; font-weight: 800; color: #484f58; }
        .lang-label.active { color: var(--white); text-shadow: 0 0 8px var(--acc); }

        main { height: 100vh; display: flex; justify-content: center; align-items: center; padding: 0 5%; background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0d1117 100%); }
        .hero-container { display: flex; align-items: center; gap: 40px; width: 100%; max-width: 1200px; }

        .hero-content { flex: 1; }
        .hero-content h1 { font-size: clamp(2.5rem, 5vw, 4rem); color: var(--white); margin-bottom: 15px; }
        .hero-content h1 span { color: var(--acc); }
        
        /* DOWNLOAD LOGIC */
        .download-box { position: relative; display: inline-block; margin-top: 30px; }
        .main-dl-btn { background: var(--green); color: white; padding: 16px 40px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: 0.3s; position: relative; z-index: 10; }
        .main-dl-btn:hover { transform: translateY(-3px); background: #2ea043; }

        .dl-list { position: absolute; bottom: calc(100% + 12px); left: 0; width: 280px; background: var(--card); border: 1px solid #30363d; border-radius: 12px; display: none; flex-direction: column; overflow: hidden; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); z-index: 100; }
        .dl-list.active { display: flex; animation: fadeIn 0.3s ease; }
        .dl-item { padding: 16px 20px; color: var(--white); text-decoration: none; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #30363d; transition: 0.2s; cursor: pointer; }
        .dl-item:hover { background: #21262d; padding-left: 25px; }
        .dl-item i { font-size: 20px; width: 25px; text-align: center; }
        .dl-item .title { font-weight: bold; font-size: 14px; display: block; }
        .dl-item .sub { font-size: 10px; color: #8b949e; }

        .hero-code { flex: 1.2; perspective: 1000px; }
        .code-card {
            background: #010409; border: 1px solid #30363d; border-radius: 16px;
            padding: 25px; transform: rotateY(-12deg) rotateX(5deg);
            box-shadow: 30px 30px 60px rgba(0,0,0,0.7); 
            height: 340px; transition: 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .code-card:hover { transform: rotateY(0deg) rotateX(0deg) scale(1.02); border-color: var(--acc); }

        .terminal-header { display: flex; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid #21262d; padding-bottom: 10px; }
        .restart-btn { background: transparent; border: 1px solid #30363d; color: #8b949e; width: 30px; height: 30px; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .restart-btn:hover { transform: rotate(180deg); color: var(--white); }
        
        .terminal-body { font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.6; color: #d1d5db; white-space: pre-wrap; }
        .kw { color: var(--kw); font-weight: bold; }
        .str { color: var(--str); }
        .var { color: var(--var); }
        .cursor { display: inline-block; width: 8px; height: 16px; background: var(--acc); animation: blink 1s infinite; vertical-align: middle; }

        footer { position: absolute; bottom: 20px; left: 0; width: 100%; text-align: center; font-size: 12px; color: #484f58; }
        .corp-link { color: #8b949e; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .corp-link:hover { color: var(--acc); text-shadow: 0 0 10px var(--acc); }

        @keyframes blink { 50% { opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 900px) {
            .hero-container { flex-direction: column; text-align: center; gap: 20px; }
            .code-card { transform: none !important; width: 90vw; }
        }
    </style>
</head>
<body>

<canvas id="snow-canvas"></canvas>

<div class="top-controls">
    <button class="snow-btn" id="snowBtn" onclick="toggleSnow()" title="Let it snow!">
        <i class="fas fa-snowflake"></i>
    </button>
    <div class="lang-control">
        <span class="lang-label active" id="label-ru">RU</span>
        <label class="switch">
            <input type="checkbox" id="lang-toggle" onchange="toggleLanguage()">
            <span class="slider"></span>
        </label>
        <span class="lang-label" id="label-en">EN</span>
    </div>
</div>

<main>
    <div class="hero-container">
        <div class="hero-content">
            <h1 id="h1" class="fade-content">Студия <span>UZH</span></h1>
            <p id="p" class="fade-content" style="color:#8b949e; margin-bottom:30px;">
                IDE нового поколения от <b>Koshka Corp</b>. <br>Версия ядра: 20.9 [Stable]
            </p>
            <div class="download-box">
                <div class="dl-list" id="dlList">
                    <a href="uzh_station.html" download class="dl-item">
                        <i class="fab fa-windows" style="color:#00a4ef"></i>
                        <div><span class="title">Windows / Web</span><span class="sub" id="sub-win">Скачать IDE (.html)</span></div>
                    </a>
                    <a href="uzh_station.apk" download class="dl-item">
                        <i class="fab fa-android" style="color:#3ddc84"></i>
                        <div><span class="title">Android Mobile</span><span class="sub" id="sub-and">Скачать Студию (.apk)</span></div>
                    </a>
                </div>
                <button class="main-dl-btn" onclick="toggleDl()">
                    <i class="fas fa-download"></i> <span id="btn-text" class="fade-content">Скачать UZH</span>
                </button>
            </div>
        </div>

        <div class="hero-code">
            <div class="code-card">
                <div class="terminal-header">
                    <div style="display:flex; gap:6px;"><div style="width:10px; height:10px; border-radius:50%; background:#ff5f56"></div><div style="width:10px; height:10px; border-radius:50%; background:#ffbd2e"></div><div style="width:10px; height:10px; border-radius:50%; background:#27c93f"></div></div>
                    <button class="restart-btn" onclick="resetTerminal()"><i class="fas fa-redo-alt" style="font-size:12px;"></i></button>
                </div>
                <div class="terminal-body"><span id="terminal"></span><span class="cursor"></span></div>
            </div>
        </div>
    </div>
</main>

<footer>
    <p>Developed by <a href="#" class="corp-link">KOSHKA CORP.</a> | © 2026 UZH Studio</p>
</footer>

<script>
    /* СНЕГ */
    const canvas = document.getElementById('snow-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [], animationId = null, isSnowing = false;
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();
    class Particle {
        constructor() { this.reset(); }
        reset() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height - canvas.height; this.size = Math.random() * 3 + 1; this.speed = Math.random() * 1 + 0.5; this.velX = Math.random() * 0.5 - 0.25; }
        update() { this.y += this.speed; this.x += this.velX; if (this.y > canvas.height) this.reset(); }
        draw() { ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
    }
    function animateSnow() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); animationId = requestAnimationFrame(animateSnow); }
    function toggleSnow() {
        isSnowing = !isSnowing;
        const btn = document.getElementById('snowBtn');
        if (isSnowing) { btn.classList.add('active'); if (particles.length === 0) for(let i=0; i<100; i++) particles.push(new Particle()); animateSnow(); }
        else { btn.classList.remove('active'); cancelAnimationFrame(animationId); ctx.clearRect(0, 0, canvas.width, canvas.height); }
    }

    /* САЙТ */
    const translations = {
        ru: { h1: 'Студия <span>UZH</span>', p: 'IDE нового поколения от <b>Koshka Corp</b>. <br>Версия ядра: 20.9 [Stable]', btn: 'Скачать UZH', subWin: 'Скачать IDE (.html)', subAnd: 'Скачать Студию (.apk)', code: [{t: 'using-guzh', c: 'kw'}, {t: '\n\n', c: ''}, {t: 'name-', c: 'var'}, {t: '"Studio_User"', c: 'str'}, {t: '\n', c: ''}, {t: 'write-', c: 'kw'}, {t: '"Привет, UZH!"', c: 'str'}, {t: '\n\n', c: ''}, {t: 'read-', c: 'kw'}, {t: 'action', c: 'var'}, {t: '\n', c: ''}, {t: 'write-', c: 'kw'}, {t: '"Выполняю..."', c: 'str'}] },
        en: { h1: '<span>UZH</span> Studio', p: 'Next-gen IDE by <b>Koshka Corp</b>. <br>Kernel: 20.9 [Stable]', btn: 'Download UZH', subWin: 'Get IDE (.html)', subAnd: 'Get Studio (.apk)', code: [{t: 'using-guzh', c: 'kw'}, {t: '\n\n', c: ''}, {t: 'name-', c: 'var'}, {t: '"Studio_User"', c: 'str'}, {t: '\n', c: ''}, {t: 'write-', c: 'kw'}, {t: '"Hello, UZH!"', c: 'str'}, {t: '\n\n', c: ''}, {t: 'read-', c: 'kw'}, {t: 'action', c: 'var'}, {t: '\n', c: ''}, {t: 'write-', c: 'kw'}, {t: '"Processing..."', c: 'str'}] }
    };

    let currentLang = 'ru', tokenIdx = 0, charIdx = 0, typingTimer;
    function typeCode() {
        const terminal = document.getElementById('terminal');
        const tokens = translations[currentLang].code;
        if (tokenIdx < tokens.length) {
            const token = tokens[tokenIdx];
            if (charIdx === 0) { const span = document.createElement('span'); if (token.c) span.className = token.c; span.id = 'active-token'; terminal.appendChild(span); }
            const activeSpan = document.getElementById('active-token');
            activeSpan.textContent += token.t[charIdx]; charIdx++;
            if (charIdx >= token.t.length) { activeSpan.id = ''; tokenIdx++; charIdx = 0; }
            typingTimer = setTimeout(typeCode, 45);
        }
    }
    function resetTerminal() { clearTimeout(typingTimer); document.getElementById('terminal').innerHTML = ''; tokenIdx = 0; charIdx = 0; typeCode(); }
    function toggleLanguage() {
        const isEn = document.getElementById('lang-toggle').checked;
        currentLang = isEn ? 'en' : 'ru';
        document.querySelectorAll('.fade-content').forEach(f => f.classList.add('fade-hidden'));
        setTimeout(() => {
            document.getElementById('h1').innerHTML = translations[currentLang].h1;
            document.getElementById('p').innerHTML = translations[currentLang].p;
            document.getElementById('btn-text').innerText = translations[currentLang].btn;
            document.getElementById('sub-win').innerText = translations[currentLang].subWin;
            document.getElementById('sub-and').innerText = translations[currentLang].subAnd;
            document.querySelectorAll('.fade-content').forEach(f => f.classList.remove('fade-hidden'));
            resetTerminal();
        }, 300);
    }
    function toggleDl() { document.getElementById('dlList').classList.toggle('active'); }
    window.onclick = e => { if (!e.target.closest('.download-box')) document.getElementById('dlList').classList.remove('active'); }
    window.onload = typeCode;
</script>
</body>
</html>
