<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UZH Studio | Next-Gen IDE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --acc: #58a6ff;
            --green: #238636;
            --txt: #c9d1d9;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: all 0.3s ease; }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--txt);
            overflow-x: hidden;
        }

        /* Плавная смена контента */
        .fade-text { transition: opacity 0.3s ease; opacity: 1; }
        .fade-out { opacity: 0; }

        /* Дизайн ползунка (Toggle Switch) */
        .lang-control {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(22, 27, 34, 0.8);
            padding: 8px 15px;
            border-radius: 50px;
            border: 1px solid #30363d;
            backdrop-filter: blur(10px);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #30363d;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px; width: 16px;
            left: 3px; bottom: 3px;
            background-color: var(--white);
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--acc); }
        input:checked + .slider:before { transform: translateX(22px); }

        .lang-label { font-size: 12px; font-weight: bold; color: #8b949e; cursor: pointer; }
        .lang-label.active { color: var(--white); }

        /* Основной стиль */
        header {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10%;
            background: radial-gradient(circle at 20% 50%, #1e293b 0%, #0d1117 100%);
        }

        .hero-container { display: flex; align-items: center; gap: 50px; width: 100%; }
        .hero-content { flex: 1; }
        .hero-content h1 { font-size: 4rem; color: var(--white); line-height: 1.1; margin-bottom: 20px; }
        .hero-content h1 span { color: var(--acc); }

        .download-box { position: relative; display: inline-block; margin-top: 40px; }
        .main-dl-btn {
            background: var(--green);
            color: white;
            padding: 18px 45px;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 20px rgba(35, 134, 54, 0.3);
            z-index: 5;
        }

        .dl-list {
            position: absolute;
            bottom: calc(100% + 15px);
            left: 0; width: 115%;
            background: var(--card);
            border: 1px solid #30363d;
            border-radius: 12px;
            display: none;
            flex-direction: column;
            z-index: 100;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            transform: translateY(10px);
            transition: 0.3s;
        }
        .dl-list.active { display: flex; transform: translateY(0); }

        .dl-item {
            padding: 15px 25px;
            color: var(--white);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #30363d;
        }
        .dl-item:hover { background: #21262d; }

        /* Код */
        .hero-code { flex: 1.2; perspective: 1000px; }
        .code-card {
            background: #010409;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 25px;
            transform: rotateY(-5deg) rotateX(5deg);
            box-shadow: 20px 20px 60px rgba(0,0,0,0.5);
        }

        pre { font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.6; }
        .kw { color: #ff7b72; }
        .str { color: #a5d6ff; }
        .var { color: #ffa657; }

        @media (max-width: 1000px) {
            .hero-container { flex-direction: column; text-align: center; }
            header { padding: 100px 5%; }
        }
    </style>
</head>
<body>

<div class="lang-control">
    <span class="lang-label" id="label-ru">RU</span>
    <label class="switch">
        <input type="checkbox" id="lang-toggle" onchange="toggleLanguage()">
        <span class="slider"></span>
    </label>
    <span class="lang-label" id="label-en">EN</span>
</div>

<header>
    <div class="hero-container">
        <div class="hero-content">
            <h1 id="h1" class="fade-text">Студия <span>UZH</span></h1>
            <p id="p" class="fade-text" style="color: #8b949e; margin-bottom: 20px; font-size: 1.2rem;">
                Профессиональная среда разработки GUZH. <br>Версия ядра: 20.9 [Stable]
            </p>

            <div class="download-box">
                <div class="dl-list" id="dlList">
                    <a href="uzh_station.html" download class="dl-item">
                        <i class="fab fa-windows" style="color:#00a4ef"></i>
                        <div>
                            <div style="font-weight: bold;">Windows / Web</div>
                            <div style="font-size: 10px; color: #8b949e;" class="dl-sub">Скачать IDE (.html)</div>
                        </div>
                    </a>
                    <a href="uzh_station.apk" download class="dl-item">
                        <i class="fab fa-android" style="color:#3ddc84"></i>
                        <div>
                            <div style="font-weight: bold;">Android Mobile</div>
                            <div style="font-size: 10px; color: #8b949e;" class="dl-sub">Скачать Студию (.apk)</div>
                        </div>
                    </a>
                </div>
                <button class="main-dl-btn" onclick="toggleDl()">
                    <i class="fas fa-download"></i> <span id="btn-text" class="fade-text">Скачать UZH</span>
                </button>
            </div>
        </div>

        <div class="hero-code">
            <div class="code-card">
                <div style="display:flex; gap:8px; margin-bottom:15px; border-bottom: 1px solid #21262d; padding-bottom:10px;">
                    <div style="width:10px; height:10px; border-radius:50%; background:#ff5f56"></div>
                    <div style="width:10px; height:10px; border-radius:50%; background:#ffbd2e"></div>
                    <div style="width:10px; height:10px; border-radius:50%; background:#27c93f"></div>
                </div>
                <pre>
<span class="kw">using-guzh</span>

<span class="var">name</span>-<span class="str">"Studio_User"</span>
<span class="kw">write-</span><span class="str">"UZH Studio запущен"</span>

<span class="kw">read-</span><span class="var">action</span>
<span class="kw">write-</span><span class="str">"Выполняю команду..."</span>
<span class="kw">write-</span><span class="var">action</span>

<span class="kw">write-</span><span class="str">"Статус: Стабильно"</span></pre>
            </div>
        </div>
    </div>
</header>

<script>
    const translations = {
        ru: {
            h1: 'Студия <span>UZH</span>',
            p: 'Профессиональная среда разработки GUZH. <br>Версия ядра: 20.9 [Stable]',
            btn: 'Скачать UZH',
            dlSubWin: 'Скачать IDE (.html)',
            dlSubAnd: 'Скачать Студию (.apk)'
        },
        en: {
            h1: '<span>UZH</span> Studio',
            p: 'Professional GUZH development environment. <br>Kernel Version: 20.9 [Stable]',
            btn: 'Download UZH',
            dlSubWin: 'Get IDE (.html)',
            dlSubAnd: 'Get Studio (.apk)'
        }
    };

    function toggleLanguage() {
        const isEn = document.getElementById('lang-toggle').checked;
        const lang = isEn ? 'en' : 'ru';
        
        // Эффект плавного исчезновения
        const elements = document.querySelectorAll('.fade-text');
        const labels = { ru: document.getElementById('label-ru'), en: document.getElementById('label-en') };

        elements.forEach(el => el.classList.add('fade-out'));
        
        setTimeout(() => {
            document.getElementById('h1').innerHTML = translations[lang].h1;
            document.getElementById('p').innerHTML = translations[lang].p;
            document.getElementById('btn-text').innerText = translations[lang].btn;
            
            const subs = document.querySelectorAll('.dl-sub');
            subs[0].innerText = translations[lang].dlSubWin;
            subs[1].innerText = translations[lang].dlSubAnd;

            // Смена активного текста в тумблере
            if(lang === 'en') {
                labels.en.classList.add('active');
                labels.ru.classList.remove('active');
            } else {
                labels.ru.classList.add('active');
                labels.en.classList.remove('active');
            }

            // Плавное появление
            elements.forEach(el => el.classList.remove('fade-out'));
        }, 300);
    }

    // Инициализация
    document.getElementById('label-ru').classList.add('active');

    function toggleDl() { document.getElementById('dlList').classList.toggle('active'); }
    window.onclick = function(e) {
        if (!e.target.closest('.download-box')) { document.getElementById('dlList').classList.remove('active'); }
    }
</script>
</body>
</html>
